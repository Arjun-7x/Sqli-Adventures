<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <style>
    * { box-sizing: border-box; }
    body { background: #0a0e0a; margin: 0; overflow-x: hidden; }
    canvas#bg { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.08; pointer-events:none; }
    .scanlines { pointer-events:none; position:fixed; inset:0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px); z-index:10; }
    .topbar { position: sticky; top:0; z-index: 20; display:flex; justify-content:space-between; align-items:center;
      background: #0a0e0ae0; backdrop-filter: blur(6px); border-bottom: 1px solid #ffffff15; padding: 12px 24px; font-family:'JetBrains Mono',monospace; }
    .topbar a { color:#4ade80; text-decoration:none; font-size:0.85rem; border:1px solid #4ade8040; padding:4px 10px; border-radius:4px; }
    .topbar a:hover { background:#4ade8020; }
    .progress { color:#5a6a5a; font-size:0.8rem; }
    .terminal { max-width: 780px; margin: 0 auto; padding: 40px 24px 40px; position:relative; z-index:2; }
    h1 { color:#4ade80; font-size:1.8rem; border-bottom:1px solid #ffffff20; padding-bottom:12px; opacity:0; }
    h1.reveal { opacity:1; }
    h1::before { content:"$ "; color:#5a6a5a; }
    h1 .cursor { display:inline-block; width:8px; height:1.4rem; background:#4ade80; vertical-align:-3px; animation:blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }
    h2 { color:#4ade80; font-size:1.2rem; margin-top:2.5em; position:relative; transition: text-shadow 0.15s; }
    h2::before { content:"> "; color:#5a6a5a; }
    h2:hover { text-shadow: 2px 0 #ff005580, -2px 0 #00fff980; }
    a { color:#4ade80; text-decoration:none; border-bottom:1px dashed #4ade80; }
    a:hover { border-bottom-style: solid; }
    code, pre { background:#12181280; border:1px solid #ffffff15; border-radius:4px; font-family:'JetBrains Mono',monospace; }
    pre { padding:14px 18px; overflow-x:auto; position:relative; }
    code { padding:2px 6px; font-size:0.9em; }
    img { max-width:100%; border:1px solid #ffffff20; border-radius:6px; margin:16px 0; cursor: zoom-in; transition: transform 0.2s; filter: grayscale(0.15); }
    img:hover { filter: grayscale(0); }
    blockquote { border-left:3px solid #4ade80; margin-left:0; padding-left:16px; color:#5a6a5a; }
    hr { border:none; border-top:1px dashed #ffffff20; margin:3em 0; }
    .navfooter { display:flex; justify-content:space-between; gap:12px; margin-top:3em; padding-top:1.5em; border-top:1px solid #ffffff15; font-family:'JetBrains Mono',monospace; }
    .navfooter a { flex:1; border:1px solid #ffffff20; border-bottom:1px solid #ffffff20; padding:14px 18px; border-radius:6px; text-align:center; font-size:0.85rem; transition: all 0.2s; }
    .navfooter a:hover { border-color:#4ade80; background:#4ade8010; }
    .navfooter .dir { display:block; color:#5a6a5a; font-size:0.7rem; margin-bottom:4px; }
    .lightbox { position:fixed; inset:0; background:#000000e0; display:none; align-items:center; justify-content:center; z-index:100; cursor:zoom-out; }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:92vw; max-height:92vh; border:1px solid #4ade8060; margin:0; }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="scanlines"></div>

<div class="topbar">
  <a href="{{ '/' | relative_url }}">cd ~/home</a>
  <span class="progress" id="progress"></span>
</div>

<main class="terminal">
  {{ content }}
  <div class="navfooter" id="navfooter"></div>
</main>

<div class="lightbox" id="lightbox"><img id="lightbox-img" src=""></div>

<script>
const labs = [
  ["lab-1-retrieving-hidden-data", "Lab 1: Retrieving hidden data"],
  ["lab-2-login-bypass", "Lab 2: Login bypass"],
  ["lab-3-union-column-count", "Lab 3: UNION column count"],
  ["lab-4-union-text-column", "Lab 4: UNION text column"],
  ["lab-5-union-retrieve-data", "Lab 5: UNION retrieve data"],
  ["lab-6-multiple-values-column", "Lab 6: Multiple values, one column"],
  ["lab-7-oracle-version", "Lab 7: Oracle version"],
  ["lab-8-mysql-mssql-version", "Lab 8: MySQL/MSSQL version"],
  ["lab-9-listing-contents", "Lab 9: Listing contents (non-Oracle)"],
  ["lab-10-oracle-contents", "Lab 10: Listing contents (Oracle)"],
  ["lab-11-blind-conditional", "Lab 11: Conditional responses"],
  ["lab-12-conditional-errors", "Lab 12: Conditional errors"],
  ["lab-13-visible-error-based", "Lab 13: Visible error-based"],
  ["lab-14-time-delays", "Lab 14: Time delays"],
  ["lab-15-time-delay-extraction", "Lab 15: Time-delay extraction"],
  ["lab-16-oob-interaction", "Lab 16: Out-of-band interaction"],
  ["lab-17-oob-exfiltration", "Lab 17: Out-of-band exfiltration"],
  ["lab-18-xml-encoding-bypass", "Lab 18: XML encoding bypass"]
];

const path = window.location.pathname;
const slug = path.split('/').filter(Boolean).pop()?.replace(/\.(html|md)$/, '') || '';
const idx = labs.findIndex(l => l[0] === slug);

if (idx !== -1) {
  document.getElementById('progress').textContent = `lab ${idx + 1} of ${labs.length}`;
  const nav = document.getElementById('navfooter');
  const base = path.substring(0, path.lastIndexOf('/') + 1);
  if (idx > 0) {
    const [pslug, ptitle] = labs[idx - 1];
    nav.innerHTML += `<a href="${base}${pslug}.html"><span class="dir">&larr; previous</span>${ptitle}</a>`;
  }
  if (idx < labs.length - 1) {
    const [nslug, ntitle] = labs[idx + 1];
    nav.innerHTML += `<a href="${base}${nslug}.html"><span class="dir">next &rarr;</span>${ntitle}</a>`;
  }
}

const h1 = document.querySelector('h1');
if (h1) {
  const text = h1.textContent;
  h1.textContent = '';
  h1.classList.add('reveal');
  let i = 0;
  function type() {
    if (i <= text.length) {
      h1.innerHTML = text.slice(0, i) + '<span class="cursor"></span>';
      i++;
      setTimeout(type, 18);
    } else {
      h1.innerHTML = text;
    }
  }
  type();
}

document.querySelectorAll('main img').forEach(img => {
  img.addEventListener('click', () => {
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox').classList.add('open');
  });
});
document.getElementById('lightbox').addEventListener('click', function() {
  this.classList.remove('open');
});

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const chars = "01"; const fontSize = 14;
const columns = Math.floor(canvas.width / fontSize);
const drops = Array(columns).fill(1);
function draw() {
  ctx.fillStyle = "rgba(10,14,10,0.1)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#4ade80";
  ctx.font = fontSize + "px monospace";
  drops.forEach((y, i) => {
    ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, y * fontSize);
    if (y * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
    drops[i]++;
  });
}
setInterval(draw, 60);
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
</script>
</body>
</html>
